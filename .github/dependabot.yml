version: 2
updates:
  - package-ecosystem: "npm" # pnpm-lock.yaml is covered by the npm ecosystem
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # @docusaurus/* are pinned to the same version, bump together
      docusaurus:
        patterns:
          - "@docusaurus/*"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
